services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowers_tg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowers_tg"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file:
      - ./.env.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
    env_file:
      - ./.env.bot
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
